<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Asociación de Rodeo Santiago Cumbre</title>
    <!-- Librería SheetJS para Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; padding: 20px; color: #333; margin: 0; }
        .login-screen { background: white; max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-screen input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-screen button { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;}
        
        .admin-dashboard { display: none; max-width: 1200px; margin: auto; }
        h1, h2 { color: white; text-align: center; margin-bottom: 5px; }
        .subtitulo-admin { text-align: center; color: #bdc3c7; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        .flex-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        
        input, select, button { padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
        .btn-crear { background-color: #2980b9; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-crear:hover { background-color: #1f6391; }
        .btn-cerrar { background-color: #e67e22; color: white; border: none; padding: 5px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .btn-eliminar { background-color: #c0392b; color: white; border: none; padding: 5px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; }
        
        .btn-excel { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
        .btn-pago { background-color: #f1c40f; color: #2c3e50; font-weight: bold; padding: 5px 10px; border-radius: 4px; text-decoration: none; display: inline-block; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 5px; border: none; font-size: 13px;}
        .btn-aprobar { background-color: #27ae60; color: white; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; width: 100%; margin-bottom: 5px; font-size: 13px; }
        .btn-rechazar { background-color: #e74c3c; color: white; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; width: 100%; margin-bottom: 5px; font-size: 13px; }

        .badge-pendiente { background: #fcf3cf; color: #b7950b; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        .badge-aprobado { background: #d4efdf; color: #1e8449; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        .badge-rechazado { background: #fadbd8; color: #922b21; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px;}

        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
        .botones-item { display: flex; gap: 5px; }
        
        .timer { font-family: monospace; font-weight: bold; color: #27ae60; font-size: 1em; background: #e8f8f5; padding: 2px 6px; border-radius: 4px;}
        .timer-countdown { font-family: monospace; font-weight: bold; color: #d35400; font-size: 1em; background: #ffeaa7; padding: 2px 6px; border-radius: 4px;}
        .etiqueta-rodeo { font-size: 12px; color: #7f8c8d; font-weight: bold; }
        
        .filtros-container { display: flex; gap: 10px; background: #ecf0f1; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #bdc3c7;}
        .filtros-container select { margin-bottom: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top;}
        th { background-color: #f4f4f4; color: #333;}
        .meta-info { font-size: 12px; color: #7f8c8d; display: block;}
        .acciones-col { width: 130px; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <h2>🔒 Panel de Control</h2>
        <p>Asociación de Rodeo Santiago Cumbre</p>
        <input type="password" id="passInput" placeholder="Contraseña">
        <button onclick="verificarPassword()">Ingresar</button>
    </div>

    <div class="admin-dashboard" id="adminDashboard">
        <h1>⚙️ Panel de Administración</h1>
        <div class="subtitulo-admin">Asociación de Rodeo Santiago Cumbre</div>

        <div class="flex-grid">
            <div class="col card">
                <h3>🤠 Gestión de Rodeos</h3>
                <input type="text" id="nuevoRodeo" placeholder="Nombre del nuevo rodeo">
                <button class="btn-crear" onclick="crearRodeo()">+ Abrir Nuevo Rodeo</button>
                <h4>Rodeos Registrados:</h4>
                <div id="listaRodeos"></div>
            </div>

            <div class="col card">
                <h3>🐎 Gestión de Series</h3>
                <select id="rodeoParaSerie"><option value="">Cargando...</option></select>
                <input type="text" id="nuevaSerie" placeholder="Nombre de la serie">
                <input type="number" id="tiempoSerie" placeholder="Minutos de duración (Cronómetro)" min="1">
                <button class="btn-crear" onclick="crearSerie()">+ Abrir Serie con Temporizador</button>
                <h4>Series Registradas:</h4>
                <div id="listaSeries"></div>
            </div>
        </div>

        <div class="card">
            <h3>📋 Base de Datos de Colleras Inscritas</h3>
            
            <div class="filtros-container">
                <div style="flex: 1;">
                    <label style="font-size: 12px; font-weight: bold; color: #7f8c8d;">Filtrar por Rodeo:</label>
                    <select id="filtroRodeoTabla" onchange="renderizarTabla()">
                        <option value="TODOS">Todos los Rodeos</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 12px; font-weight: bold; color: #7f8c8d;">Filtrar por Serie:</label>
                    <select id="filtroSerieTabla" onchange="renderizarTabla()">
                        <option value="TODOS">Todas las Series</option>
                    </select>
                </div>
            </div>

            <button class="btn-excel" onclick="exportarExcel()">📥 Descargar Excel con Formato Oficial</button>
            
            <div style="overflow-x: auto;">
                <table id="tablaInscripciones">
                    <thead>
                        <tr>
                            <th>Serie / Rodeo</th>
                            <th>Datos de la Collera</th>
                            <th class="acciones-col">Acción / Pago</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCqtSOu4YemJGUb9dRG_7IDZZBL4E3yNsM",
          authDomain: "inscripciones-rodeos-909bb.firebaseapp.com",
          projectId: "inscripciones-rodeos-909bb",
          storageBucket: "inscripciones-rodeos-909bb.firebasestorage.app",
          messagingSenderId: "541411909779",
          appId: "1:541411909779:web:4cae02b122a4ac8928ad66"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let inscripcionesGlobales = [];
        window.seriesCerrando = {}; 

        window.verificarPassword = function() {
            if(document.getElementById('passInput').value === "rodeo2026") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminDashboard').style.display = "block";
                iniciarBaseDeDatos();
            } else { alert("Contraseña incorrecta"); }
        };

        function iniciarBaseDeDatos() {
            onSnapshot(collection(db, "rodeos"), (snapshot) => {
                const contenedorRodeos = document.getElementById('listaRodeos');
                const selectorRodeoParaSerie = document.getElementById('rodeoParaSerie');
                const filtroRodeoTabla = document.getElementById('filtroRodeoTabla');
                
                contenedorRodeos.innerHTML = '';
                selectorRodeoParaSerie.innerHTML = '<option value="">1. Seleccione a qué Rodeo pertenece la serie...</option>';
                const seleccionRodeoActual = filtroRodeoTabla.value;
                filtroRodeoTabla.innerHTML = '<option value="TODOS">Todos los Rodeos</option>';

                snapshot.forEach(d => {
                    const data = d.data();
                    filtroRodeoTabla.innerHTML += `<option value="${data.nombre}">${data.nombre}</option>`;
                    
                    let estadoTexto = data.estado === "abierto" ? `<span class="timer">Abierto</span>` : `<span style="color:#e74c3c; font-size:12px; font-weight:bold;">Cerrado</span>`;
                    
                    contenedorRodeos.innerHTML += `
                        <div class="item-lista">
                            <div><strong>${data.nombre}</strong><br>${estadoTexto}</div>
                            <div class="botones-item">
                                <button class="btn-cerrar" onclick="cambiarEstadoItem('rodeos', '${d.id}', '${data.estado === "abierto" ? "cerrado" : "abierto"}')">${data.estado === "abierto" ? "Cerrar" : "Abrir"}</button>
                                <button class="btn-eliminar" onclick="borrarPermanente('rodeos', '${d.id}', '¿Borrar este Rodeo?')">🗑️ Borrar</button>
                            </div>
                        </div>`;
                    if(data.estado === "abierto") {
                        selectorRodeoParaSerie.innerHTML += `<option value="${data.nombre}">${data.nombre}</option>`;
                    }
                });
                filtroRodeoTabla.value = seleccionRodeoActual || "TODOS";
            });

            onSnapshot(collection(db, "series"), (snapshot) => {
                const contenedor = document.getElementById('listaSeries');
                const filtroSerieTabla = document.getElementById('filtroSerieTabla');
                contenedor.innerHTML = '';
                const seleccionSerieActual = filtroSerieTabla.value;
                filtroSerieTabla.innerHTML = '<option value="TODOS">Todas las Series</option>';

                snapshot.forEach(d => {
                    const data = d.data();
                    filtroSerieTabla.innerHTML += `<option value="${data.nombre}">${data.nombre} (${data.rodeoNombre})</option>`;
                    
                    let infoEstadoSerie = "";
                    if(data.estado === "abierto") {
                        infoEstadoSerie = `<span class="timer-countdown" data-cierre="${data.fechaCierre}" data-id="${d.id}">Calculando...</span>`;
                    } else {
                        infoEstadoSerie = `<span style="color:#e74c3c; font-size:12px; font-weight:bold;">Cerrada Manualmente</span>`;
                    }

                    contenedor.innerHTML += `
                        <div class="item-lista">
                            <div>
                                <strong>${data.nombre}</strong> <br>
                                <span class="etiqueta-rodeo">${data.rodeoNombre}</span> | ${infoEstadoSerie}
                            </div>
                            <div class="botones-item">
                                <button class="btn-cerrar" onclick="cambiarEstadoItem('series', '${d.id}', '${data.estado === "abierto" ? "cerrado" : "abierto"}')">${data.estado === "abierto" ? "Cerrar" : "Abrir"}</button>
                                <button class="btn-eliminar" onclick="borrarPermanente('series', '${d.id}', '¿Borrar esta Serie?')">🗑️ Borrar</button>
                            </div>
                        </div>`;
                });
                filtroSerieTabla.value = seleccionSerieActual || "TODOS";
            });

            onSnapshot(collection(db, "inscripciones"), (snapshot) => {
                inscripcionesGlobales = [];
                snapshot.forEach(d => {
                    const ins = d.data();
                    ins.id = d.id;
                    inscripcionesGlobales.push(ins);
                });
                renderizarTabla();
            });
        }

        window.renderizarTabla = function() {
            const tbody = document.querySelector('#tablaInscripciones tbody');
            tbody.innerHTML = '';
            const filtroRodeo = document.getElementById('filtroRodeoTabla').value;
            const filtroSerie = document.getElementById('filtroSerieTabla').value;

            inscripcionesGlobales.forEach(ins => {
                if (filtroRodeo !== "TODOS" && ins.rodeo !== filtroRodeo) return;
                if (filtroSerie !== "TODOS" && ins.serie !== filtroSerie) return;

                let colleraHTML = `
                    <div style="margin-bottom: 6px;"><strong>1° Jinete:</strong> ${ins.jinete1} [RUT: ${ins.rut1}]<br>
                    <span class="meta-info">🐴 Caballo: ${ins.caballo1} (N° ${ins.nroCaballo1}) | Club: ${ins.club1} | Criadero: ${ins.criadero1}</span></div>
                    <div><strong>2° Jinete:</strong> ${ins.jinete2} [RUT: ${ins.rut2}]<br>
                    <span class="meta-info">🐴 Caballo: ${ins.caballo2} (N° ${ins.nroCaballo2}) | Club: ${ins.club2} | Criadero: ${ins.criadero2}</span></div>
                `;

                let estadoPago = ins.estadoPago || "pendiente";
                let badgeEstado = estadoPago === "aprobado" ? `<span class="badge-aprobado">✅ APROBADO</span>` :
                                  estadoPago === "rechazado" ? `<span class="badge-rechazado">❌ RECHAZADO</span>` :
                                  `<span class="badge-pendiente">⏳ PENDIENTE</span>`;

                let botonPagoHTML = ins.comprobanteUrl ? `<a href="${ins.comprobanteUrl}" target="_blank" class="btn-pago">👁️ Ver Pago</a>` : '';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${ins.serie}</strong><br><span class="meta-info">${ins.rodeo}</span></td>
                        <td>${colleraHTML}</td>
                        <td class="acciones-col">
                            ${badgeEstado}
                            ${botonPagoHTML}
                            <button class="btn-aprobar" onclick="cambiarEstadoPago('${ins.id}', 'aprobado')">Aprobar</button>
                            <button class="btn-rechazar" onclick="cambiarEstadoPago('${ins.id}', 'rechazado')">Rechazar</button>
                            <button class="btn-eliminar" style="width:100%; margin-top:5px;" onclick="borrarPermanente('inscripciones', '${ins.id}', '¿Eliminar esta collera?')">🗑️ Borrar</button>
                        </td>
                    </tr>`;
            });
        }

        window.cambiarEstadoPago = async function(id, nuevoEstado) {
            try {
                await updateDoc(doc(db, "inscripciones", id), { estadoPago: nuevoEstado });
            } catch (err) { alert("Error: " + err.message); }
        };

        window.cambiarEstadoItem = async function(coleccion, id, nuevoEstado) {
            try {
                await updateDoc(doc(db, coleccion, id), { estado: nuevoEstado });
            } catch (err) { alert("Error: " + err.message); }
        };

        window.borrarPermanente = async function(coleccion, id, mensaje) {
            if(confirm(mensaje)) {
                try {
                    await deleteDoc(doc(db, coleccion, id));
                } catch (err) { alert("Error al borrar: " + err.message); }
            }
        };

        window.crearRodeo = async function() {
            const nombre = document.getElementById('nuevoRodeo').value;
            if(!nombre) return alert("Escribe un nombre");
            await addDoc(collection(db, "rodeos"), { nombre: nombre, estado: "abierto", fechaApertura: Date.now() });
            document.getElementById('nuevoRodeo').value = '';
        };

        window.crearSerie = async function() {
            const rodeo = document.getElementById('rodeoParaSerie').value;
            const serie = document.getElementById('nuevaSerie').value;
            const minutos = parseInt(document.getElementById('tiempoSerie').value);
            if(!rodeo || !serie || !minutos) return alert("Completa todos los campos");
            
            await addDoc(collection(db, "series"), { 
                nombre: serie, rodeoNombre: rodeo, estado: "abierto", 
                fechaApertura: Date.now(), fechaCierre: Date.now() + (minutos * 60 * 1000)
            });
            document.getElementById('nuevaSerie').value = ''; document.getElementById('tiempoSerie').value = '';
        };

        function separarRut(rutCompleto) {
            if(!rutCompleto) return { cuerpo: "", dv: "" };
            let limpio = rutCompleto.replace(/\./g, '').trim();
            let partes = limpio.split('-');
            if(partes.length === 2) {
                return { cuerpo: partes[0], dv: partes[1].toUpperCase() };
            } else if(limpio.length > 1) {
                let cuerpo = limpio.slice(0, -1);
                let dv = limpio.slice(-1).toUpperCase();
                return { cuerpo: cuerpo, dv: dv };
            }
            return { cuerpo: limpio, dv: "" };
        }

        // EXCEL CON NÚMERO CORRELATIVO INDEPENDIENTE POR SERIE
        window.exportarExcel = function() {
            const filtroRodeo = document.getElementById('filtroRodeoTabla').value;
            const filtroSerie = document.getElementById('filtroSerieTabla').value;
            
            const datosAExportar = inscripcionesGlobales.filter(ins => {
                if (filtroRodeo !== "TODOS" && ins.rodeo !== filtroRodeo) return false;
                if (filtroSerie !== "TODOS" && ins.serie !== filtroSerie) return false;
                return true;
            });

            if(datosAExportar.length === 0) return alert("No hay datos para exportar.");

            // Ordenamos los datos por Serie para que el conteo correlativo funcione perfecto
            datosAExportar.sort((a, b) => (a.serie || "").localeCompare(b.serie || ""));

            let contadoresPorSerie = {};
            
            let filasExcel = datosAExportar.map(ins => {
                let nombreSerie = ins.serie || "General";
                
                // Si la serie no tiene contador iniciado, comienza en 1. Si ya existe, suma 1.
                if(!contadoresPorSerie[nombreSerie]) {
                    contadoresPorSerie[nombreSerie] = 1;
                } else {
                    contadoresPorSerie[nombreSerie]++;
                }

                let numeroColleraCorrelativo = contadoresPorSerie[nombreSerie];

                let r1 = separarRut(ins.rut1);
                let r2 = separarRut(ins.rut2);
                let criaderosUnidos = ins.criadero1 === ins.criadero2 ? ins.criadero1 : `${ins.criadero1} / ${ins.criadero2}`;
                
                let fechaFormateada = "-";
                if(ins.fecha) {
                    let d = new Date(ins.fecha);
                    fechaFormateada = d.toLocaleDateString('es-CL');
                }

                let estadoPagoTexto = (ins.estadoPago || "pendiente").toUpperCase();

                return {
                    "Rodeo": ins.rodeo || "-",
                    "Serie": nombreSerie,
                    "Fecha": fechaFormateada,
                    "Estado Pago": estadoPagoTexto,
                    "N° Collera": numeroColleraCorrelativo,
                    "Club": ins.club1 || "-",
                    "Nombre Primer Jinete": ins.jinete1 || "-",
                    "Rut(Sin DV)": r1.cuerpo,
                    "DV Primer Jinete": r1.dv,
                    "Nombre Primer Caballo": ins.caballo1 || "-",
                    "N° Primer Caballo": ins.nroCaballo1 || "-",
                    "Nombre Segundo jinete": ins.jinete2 || "-",
                    "Rut(Sin DV)": r2.cuerpo,
                    "DV Segundo Jinete": r2.dv,
                    "Nombre Segundo Caballo": ins.caballo2 || "-",
                    "N° Segundo Caballo": ins.nroCaballo2 || "-",
                    "Criadero": criaderosUnidos || "-",
                    "Link Comprobante (ImgBB)": ins.comprobanteUrl || "-"
                };
            });

            const ws = XLSX.utils.json_to_sheet(filasExcel);

            // Estilos, bordes y diseño profesional
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cellAddress]) continue;

                    if (!ws[cellAddress].s) ws[cellAddress].s = {};

                    ws[cellAddress].s.border = {
                        top: { style: "thin", color: { rgb: "D3D3D3" } },
                        bottom: { style: "thin", color: { rgb: "D3D3D3" } },
                        left: { style: "thin", color: { rgb: "D3D3D3" } },
                        right: { style: "thin", color: { rgb: "D3D3D3" } }
                    };

                    if (R === 0) {
                        ws[cellAddress].s.fill = { fgColor: { rgb: "1F4E78" } }; // Azul institucional
                        ws[cellAddress].s.font = { color: { rgb: "FFFFFF" }, bold: true, name: "Calibri", sz: 11 };
                        ws[cellAddress].s.alignment = { horizontal: "center", vertical: "center" };
                    } else {
                        ws[cellAddress].s.font = { name: "Calibri", sz: 11 };
                        ws[cellAddress].s.alignment = { vertical: "center" };
                    }
                }
            }

            // Autoajuste dinámico de ancho de columnas
            const colWidths = [];
            for (let C = range.s.c; C <= range.e.c; ++C) {
                let maxWidth = 10;
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                    if (ws[cellAddress] && ws[cellAddress].v) {
                        const cellLength = ws[cellAddress].v.toString().length;
                        if (cellLength > maxWidth) {
                            maxWidth = cellLength;
                        }
                    }
                }
                colWidths.push({ wch: maxWidth + 4 });
            }
            ws['!cols'] = colWidths;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inscripciones Oficiales");
            
            let nombreArchivo = "Inscripciones_Santiago_Cumbre";
            if(filtroRodeo !== "TODOS") nombreArchivo += "_" + filtroRodeo;
            if(filtroSerie !== "TODOS") nombreArchivo += "_" + filtroSerie;
            nombreArchivo += ".xlsx";
            
            XLSX.writeFile(wb, nombreArchivo);
        };

        setInterval(() => {
            document.querySelectorAll('.timer-countdown').forEach(el => {
                const cierre = parseInt(el.getAttribute('data-cierre'));
                const idSerie = el.getAttribute('data-id');
                const dif = cierre - Date.now();
                
                if (dif <= 0) {
                    el.innerText = "⏳ Expirado"; 
                    el.style.color = "#c0392b";
                    updateDoc(doc(db, "series", idSerie), { estado: "cerrado" }).catch(()=>{});
                } else {
                    let s = Math.floor(dif / 1000), h = Math.floor(s / 3600); s %= 3600; let m = Math.floor(s / 60);
                    el.innerText = `⏳ Faltan: ${h}h ${m}m ${s % 60}s`;
                }
            });
        }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Rodeo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; padding: 20px; color: #333; margin: 0; }
        .login-screen { background: white; max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-screen input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-screen button { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;}
        
        .admin-dashboard { display: none; max-width: 1200px; margin: auto; }
        h1, h2 { color: white; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        .flex-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        
        input, select, button { padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
        .btn-crear { background-color: #2980b9; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-crear:hover { background-color: #1f6391; }
        .btn-cerrar { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .btn-excel { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
        
        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
        .timer { font-family: monospace; font-weight: bold; color: #d35400; font-size: 1.1em; background: #ffeaa7; padding: 3px 8px; border-radius: 4px;}
        .etiqueta-rodeo { font-size: 12px; color: #7f8c8d; font-weight: bold; }
        
        /* Controles de Filtro */
        .filtros-container { display: flex; gap: 10px; background: #ecf0f1; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #bdc3c7;}
        .filtros-container select { margin-bottom: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; color: #333;}
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="login-screen" id="loginScreen">
        <h2>🔒 Panel de Control</h2>
        <p>Ingresa la contraseña de administrador</p>
        <input type="password" id="passInput" placeholder="Contraseña">
        <button onclick="verificarPassword()">Ingresar</button>
    </div>

    <!-- Panel de Control Principal -->
    <div class="admin-dashboard" id="adminDashboard">
        <h1>⚙️ Panel de Administración - Rodeo</h1>

        <div class="flex-grid">
            <!-- Columna Rodeos -->
            <div class="col card">
                <h3>🤠 Gestión de Rodeos</h3>
                <input type="text" id="nuevoRodeo" placeholder="Nombre del nuevo rodeo (Ej: Rodeo Santa Elena)">
                <button class="btn-crear" onclick="crearRodeo()">+ Abrir Nuevo Rodeo</button>
                <h4>Rodeos Abiertos (Activos):</h4>
                <div id="listaRodeos"></div>
            </div>

            <!-- Columna Series -->
            <div class="col card">
                <h3>🐎 Gestión de Series</h3>
                <select id="rodeoParaSerie">
                    <option value="">Cargando rodeos disponibles...</option>
                </select>
                <input type="text" id="nuevaSerie" placeholder="Nombre de la serie (Ej: Serie Potros)">
                <button class="btn-crear" onclick="crearSerie()">+ Abrir Nueva Serie</button>
                <h4>Series Abiertas (Enlazadas a Rodeos):</h4>
                <div id="listaSeries"></div>
            </div>
        </div>

        <!-- Tabla de Inscripciones Mejorada -->
        <div class="card">
            <h3>📋 Base de Datos de Inscripciones</h3>
            
            <!-- NUEVO: Filtros para separar la vista -->
            <div class="filtros-container">
                <div style="flex: 1;">
                    <label style="font-size: 12px; font-weight: bold; color: #7f8c8d;">Filtrar por Rodeo:</label>
                    <select id="filtroRodeoTabla" onchange="renderizarTabla()">
                        <option value="TODOS">Todos los Rodeos</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 12px; font-weight: bold; color: #7f8c8d;">Filtrar por Serie:</label>
                    <select id="filtroSerieTabla" onchange="renderizarTabla()">
                        <option value="TODOS">Todas las Series</option>
                    </select>
                </div>
            </div>

            <button class="btn-excel" onclick="exportarExcel()">📥 Descargar a Excel (Aplica filtros)</button>
            
            <div style="overflow-x: auto;">
                <table id="tablaInscripciones">
                    <thead>
                        <tr>
                            <th>Rodeo</th>
                            <th>Serie</th>
                            <th>Jinete</th>
                            <th>Compañero</th>
                            <th>Caballo</th>
                            <th>Club</th>
                            <th>Teléfono</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCqtSOu4YemJGUb9dRG_7IDZZBL4E3yNsM",
          authDomain: "inscripciones-rodeos-909bb.firebaseapp.com",
          projectId: "inscripciones-rodeos-909bb",
          storageBucket: "inscripciones-rodeos-909bb.firebasestorage.app",
          messagingSenderId: "541411909779",
          appId: "1:541411909779:web:4cae02b122a4ac8928ad66"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let inscripcionesGlobales = []; // Guarda todo el respaldo en memoria

        window.verificarPassword = function() {
            if(document.getElementById('passInput').value === "rodeo2026") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminDashboard').style.display = "block";
                iniciarBaseDeDatos();
            } else {
                alert("Contraseña incorrecta");
            }
        };

        function iniciarBaseDeDatos() {
            // Escuchar Rodeos
            onSnapshot(collection(db, "rodeos"), (snapshot) => {
                const contenedorRodeos = document.getElementById('listaRodeos');
                const selectorRodeoParaSerie = document.getElementById('rodeoParaSerie');
                const filtroRodeoTabla = document.getElementById('filtroRodeoTabla');
                
                contenedorRodeos.innerHTML = '';
                selectorRodeoParaSerie.innerHTML = '<option value="">1. Seleccione a qué Rodeo pertenece la serie...</option>';
                
                // Mantenemos la opción de "Todos" en el filtro
                const seleccionRodeoActual = filtroRodeoTabla.value;
                filtroRodeoTabla.innerHTML = '<option value="TODOS">Todos los Rodeos</option>';

                snapshot.forEach(d => {
                    const data = d.data();
                    
                    // Actualiza el filtro de la tabla con TODOS los rodeos históricos
                    filtroRodeoTabla.innerHTML += `<option value="${data.nombre}">${data.nombre}</option>`;

                    if(data.estado === "abierto") {
                        contenedorRodeos.innerHTML += `
                            <div class="item-lista">
                                <div><strong>${data.nombre}</strong><br><span class="timer" data-inicio="${data.fechaApertura}">00:00:00</span></div>
                                <button class="btn-cerrar" onclick="cerrarItem('rodeos', '${d.id}')">Cerrar</button>
                            </div>`;
                        selectorRodeoParaSerie.innerHTML += `<option value="${data.nombre}">${data.nombre}</option>`;
                    }
                });
                filtroRodeoTabla.value = seleccionRodeoActual || "TODOS";
            });

            // Escuchar Series
            onSnapshot(collection(db, "series"), (snapshot) => {
                const contenedor = document.getElementById('listaSeries');
                const filtroSerieTabla = document.getElementById('filtroSerieTabla');
                
                contenedor.innerHTML = '';
                
                const seleccionSerieActual = filtroSerieTabla.value;
                filtroSerieTabla.innerHTML = '<option value="TODOS">Todas las Series</option>';

                snapshot.forEach(d => {
                    const data = d.data();
                    
                    // Llenar filtro de la tabla
                    filtroSerieTabla.innerHTML += `<option value="${data.nombre}">${data.nombre} (${data.rodeoNombre})</option>`;

                    if(data.estado === "abierto") {
                        contenedor.innerHTML += `
                            <div class="item-lista">
                                <div>
                                    <strong>${data.nombre}</strong> <br>
                                    <span class="etiqueta-rodeo">Pertenece a: ${data.rodeoNombre}</span><br>
                                    <span class="timer" data-inicio="${data.fechaApertura}">00:00:00</span>
                                </div>
                                <button class="btn-cerrar" onclick="cerrarItem('series', '${d.id}')">Cerrar</button>
                            </div>`;
                    }
                });
                filtroSerieTabla.value = seleccionSerieActual || "TODOS";
            });

            // Escuchar TODAS las inscripciones y guardarlas en memoria
            onSnapshot(collection(db, "inscripciones"), (snapshot) => {
                inscripcionesGlobales = [];
                snapshot.forEach(d => {
                    const ins = d.data();
                    ins.id = d.id; // Guardamos el ID interno
                    inscripcionesGlobales.push(ins);
                });
                renderizarTabla(); // Dibuja la tabla aplicando los filtros actuales
            });
        }

        // NUEVO: Función para dibujar la tabla basándose en los filtros elegidos
        window.renderizarTabla = function() {
            const tbody = document.querySelector('#tablaInscripciones tbody');
            tbody.innerHTML = '';
            
            const filtroRodeo = document.getElementById('filtroRodeoTabla').value;
            const filtroSerie = document.getElementById('filtroSerieTabla').value;

            inscripcionesGlobales.forEach(ins => {
                // Si el jinete fue borrado ("eliminado"), no lo mostramos en pantalla (pero sigue en la base de datos)
                if (ins.estado === "eliminado") return; 

                // Aplicar filtros visuales
                if (filtroRodeo !== "TODOS" && ins.rodeo !== filtroRodeo) return;
                if (filtroSerie !== "TODOS" && ins.serie !== filtroSerie) return;

                tbody.innerHTML += `
                    <tr>
                        <td>${ins.rodeo}</td>
                        <td>${ins.serie}</td>
                        <td>${ins.nombre}</td>
                        <td>${ins.companero}</td>
                        <td>${ins.caballo}</td>
                        <td>${ins.club}</td>
                        <td>${ins.telefono}</td>
                        <td><button class="btn-cerrar" onclick="borrarSeguro('${ins.id}')">Borrar</button></td>
                    </tr>`;
            });
        }

        window.crearRodeo = async function() {
            const nombre = document.getElementById('nuevoRodeo').value;
            if(!nombre) return alert("Escribe un nombre para el Rodeo");
            await addDoc(collection(db, "rodeos"), { nombre: nombre, estado: "abierto", fechaApertura: Date.now() });
            document.getElementById('nuevoRodeo').value = '';
        };

        window.crearSerie = async function() {
            const rodeo = document.getElementById('rodeoParaSerie').value;
            const serie = document.getElementById('nuevaSerie').value;
            if(!rodeo || !serie) return alert("Selecciona un Rodeo y escribe una Serie.");
            await addDoc(collection(db, "series"), { nombre: serie, rodeoNombre: rodeo, estado: "abierto", fechaApertura: Date.now() });
            document.getElementById('nuevaSerie').value = '';
        };

        window.cerrarItem = async function(coleccion, id) {
            if(confirm("¿Seguro que deseas cerrar esto? Ya no aparecerá a los jinetes.")) {
                await updateDoc(doc(db, coleccion, id), { estado: "cerrado" });
            }
        };

        // NUEVO: Borrado Seguro (Soft Delete). Oculta el dato, pero no lo destruye.
        window.borrarSeguro = async function(id) {
            if(confirm("¿Seguro que deseas borrar a este jinete? (Quedará respaldado internamente en caso de error)")) {
                await updateDoc(doc(db, "inscripciones", id), { estado: "eliminado" });
            }
        };

        // NUEVO: Exportar a Excel respeta los filtros seleccionados
        window.exportarExcel = function() {
            const filtroRodeo = document.getElementById('filtroRodeoTabla').value;
            const filtroSerie = document.getElementById('filtroSerieTabla').value;
            
            // Filtramos los datos exactos que el administrador está viendo en pantalla
            const datosAExportar = inscripcionesGlobales.filter(ins => {
                if (ins.estado === "eliminado") return false;
                if (filtroRodeo !== "TODOS" && ins.rodeo !== filtroRodeo) return false;
                if (filtroSerie !== "TODOS" && ins.serie !== filtroSerie) return false;
                return true;
            });

            if(datosAExportar.length === 0) return alert("No hay datos para exportar con este filtro.");
            
            // Limpiamos los datos innecesarios antes de exportar
            const datosLimpios = datosAExportar.map(ins => ({
                Rodeo: ins.rodeo, Serie: ins.serie, Jinete: ins.nombre, 
                Compañero: ins.companero, Caballo: ins.caballo, Club: ins.club, Teléfono: ins.telefono
            }));

            const ws = XLSX.utils.json_to_sheet(datosLimpios);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inscripciones");
            
            // Le ponemos el nombre al archivo según el filtro
            let nombreArchivo = "Inscripciones";
            if(filtroRodeo !== "TODOS") nombreArchivo += "_" + filtroRodeo;
            nombreArchivo += ".xlsx";
            
            XLSX.writeFile(wb, nombreArchivo);
        };

        setInterval(() => {
            document.querySelectorAll('.timer').forEach(el => {
                const inicio = parseInt(el.getAttribute('data-inicio'));
                const dif = Date.now() - inicio;
                let segundos = Math.floor(dif / 1000);
                let horas = Math.floor(segundos / 3600);
                segundos %= 3600;
                let minutos = Math.floor(segundos / 60);
                segundos %= 60;
                el.innerText = `${horas}h ${minutos}m ${segundos}s`;
            });
        }, 1000);
    </script>
</body>
</html>

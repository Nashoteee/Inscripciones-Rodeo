<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Asociación de Rodeo Santiago Cumbre</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; padding: 20px; color: #333; margin: 0; }
        .login-screen { background: white; max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-screen input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-screen button { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;}
        .admin-dashboard { display: none; max-width: 1200px; margin: auto; }
        h1, h2 { color: white; text-align: center; margin-bottom: 5px; }
        .subtitulo-admin { text-align: center; color: #bdc3c7; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .flex-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        input, select, button { padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
        .btn-crear { background-color: #2980b9; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-excel { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
        .btn-aprobar { background-color: #27ae60; color: white; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; width: 100%; margin-bottom: 5px; font-size: 13px; }
        .btn-rechazar { background-color: #e74c3c; color: white; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; width: 100%; margin-bottom: 5px; font-size: 13px; }
        .badge-pendiente { background: #fcf3cf; color: #b7950b; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        .badge-aprobado { background: #d4efdf; color: #1e8449; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        .badge-rechazado { background: #fadbd8; color: #922b21; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
        .grid-contadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
        .card-serie-contador { background: #f8f9fa; border: 1px solid #cbd5e1; border-radius: 6px; padding: 15px; border-left: 5px solid #2980b9; }
        .stats-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
        .stat-val { font-weight: bold; padding: 1px 6px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top;}
        th { background-color: #f4f4f4; color: #333;}
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <h2>🔒 Panel de Control</h2>
        <input type="password" id="passInput" placeholder="Contraseña">
        <button onclick="verificarPassword()">Ingresar</button>
    </div>

    <div class="admin-dashboard" id="adminDashboard">
        <h1>⚙️ Panel de Administración</h1>
        <div class="subtitulo-admin">Asociación de Rodeo Santiago Cumbre</div>
        <div class="card">
            <h3><span>📊 Resumen de Colleras</span>
                <select id="filtroRodeoContadores" onchange="actualizarContadoresSeries()" style="width: 220px; margin: 0; padding: 6px;">
                    <option value="TODOS">🌐 Todos los Rodeos</option>
                </select>
            </h3>
            <div id="contenedorContadoresSeries" class="grid-contadores"></div>
        </div>

        <div class="flex-grid">
            <div class="col card">
                <h3>🤠 Gestión de Rodeos</h3>
                <input type="text" id="nuevoRodeo" placeholder="Nombre nuevo rodeo">
                <button class="btn-crear" onclick="crearRodeo()">+ Abrir</button>
                <div id="listaRodeos"></div>
            </div>
            <div class="col card">
                <h3>🐎 Gestión de Series</h3>
                <select id="rodeoParaSerie"></select>
                <input type="text" id="nuevaSerie" placeholder="Nombre serie">
                <input type="number" id="tiempoSerie" placeholder="Minutos">
                <button class="btn-crear" onclick="crearSerie()">+ Abrir Serie</button>
                <div id="listaSeries"></div>
            </div>
        </div>

        <div class="card">
            <h3>📋 Base de Datos de Inscripciones</h3>
            <button class="btn-excel" onclick="exportarExcel()">📥 Descargar Excel con Formato</button>
            <table id="tablaInscripciones">
                <thead><tr><th>Serie / Rodeo</th><th>Datos de la Collera</th><th>Acción</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, deleteDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCqtSOu4YemJGUb9dRG_7IDZZBL4E3yNsM", authDomain: "inscripciones-rodeos-909bb.firebaseapp.com", projectId: "inscripciones-rodeos-909bb", storageBucket: "inscripciones-rodeos-909bb.firebasestorage.app", messagingSenderId: "541411909779", appId: "1:541411909779:web:4cae02b122a4ac8928ad66" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        
        let inscripcionesGlobales = [], seriesGlobales = [];

        async function sha256(m) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(m)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join(''); }

window.verificarPassword = async function() {
    const inputPass = document.getElementById('passInput').value;
    const hashIngresado = await sha256(inputPass);
    const hashCorrecto = "4396a8435d679693cf8419615a6b0c6114a87e51c8908f02844111394a10738e";

    // Aquí agregamos la validación condicional
    if (hashIngresado === hashCorrecto) {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('adminDashboard').style.display = "block";
        iniciarBaseDeDatos();
    } else {
        alert("Contraseña incorrecta");
    }
};

        
        function iniciarBaseDeDatos() {
            onSnapshot(collection(db, "rodeos"), (s) => {
                const fR = document.getElementById('filtroRodeoContadores'), sR = document.getElementById('rodeoParaSerie');
                fR.innerHTML = '<option value="TODOS">🌐 Todos los Rodeos</option>';
                sR.innerHTML = '';
                s.forEach(d => { fR.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; sR.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; });
            });
            onSnapshot(collection(db, "series"), (s) => { seriesGlobales = []; s.forEach(d => { let data = d.data(); data.id = d.id; seriesGlobales.push(data); }); actualizarContadoresSeries(); });
            onSnapshot(collection(db, "inscripciones"), (s) => { inscripcionesGlobales = []; s.forEach(d => { let ins = d.data(); ins.id = d.id; inscripcionesGlobales.push(ins); }); renderizarTabla(); actualizarContadoresSeries(); });
        }

        window.actualizarContadoresSeries = function() {
            const cont = document.getElementById('contenedorContadoresSeries'), fil = document.getElementById('filtroRodeoContadores').value;
            cont.innerHTML = '';
            seriesGlobales.filter(s => fil === "TODOS" || s.rodeoNombre === fil).forEach(s => {
                const ins = inscripcionesGlobales.filter(i => i.serie === s.nombre && i.rodeo === s.rodeoNombre);
                cont.innerHTML += `<div class="card-serie-contador"><h4>${s.nombre}</h4>
                    <div class="stats-row"><span>Total:</span> <span class="stat-val">${ins.length}</span></div>
                    <div class="stats-row"><span>✅ Aprobadas:</span> <span class="stat-val">${ins.filter(i=>i.estadoPago==='aprobado').length}</span></div>
                    <div class="stats-row"><span>⏳ Pendientes:</span> <span class="stat-val">${ins.filter(i=>!i.estadoPago||i.estadoPago==='pendiente').length}</span></div>
                </div>`;
            });
        };

        window.renderizarTabla = function() {
            const tbody = document.querySelector('#tablaInscripciones tbody'); tbody.innerHTML = '';
            inscripcionesGlobales.forEach(ins => {
                tbody.innerHTML += `<tr><td><strong>${ins.serie}</strong><br>${ins.rodeo}</td>
                    <td>J1: ${ins.jinete1} | J2: ${ins.jinete2}</td>
                    <td><button class="btn-aprobar" onclick="cambiarEstado('${ins.id}', 'aprobado')">Aprobar</button>
                    <button class="btn-rechazar" onclick="cambiarEstado('${ins.id}', 'rechazado')">Rechazar</button></td></tr>`;
            });
        };

        window.cambiarEstado = async (id, est) => await updateDoc(doc(db, "inscripciones", id), { estadoPago: est });
        window.crearRodeo = async () => await addDoc(collection(db, "rodeos"), { nombre: document.getElementById('nuevoRodeo').value, estado: "abierto" });
        window.crearSerie = async () => await addDoc(collection(db, "series"), { nombre: document.getElementById('nuevaSerie').value, rodeoNombre: document.getElementById('rodeoParaSerie').value, estado: "abierto", fechaCierre: Date.now() + (parseInt(document.getElementById('tiempoSerie').value)*60000) });
        
        window.exportarExcel = function() {
            let cont = {};
            const data = inscripcionesGlobales.map(i => {
                cont[i.serie] = (cont[i.serie] || 0) + 1;
                return { "Rodeo": i.rodeo, "Serie": i.serie, "N° Collera": cont[i.serie], "Jinete 1": i.jinete1, "Jinete 2": i.jinete2, "Estado Pago": i.estadoPago };
            });
            const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Inscripciones"); XLSX.writeFile(wb, "Inscripciones.xlsx");
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones de Rodeo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center;}
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 6px; background-color: #ffffff; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        button { cursor: pointer; background-color: #27ae60; color: white; border: none; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #219150; }
        .mensaje-cerrado { display: none; background: #f8d7da; color: #721c24; padding: 20px; border-radius: 6px; text-align: center; border: 1px solid #f5c6cb; margin-bottom: 20px; }
        .admin-link { display: block; text-align: center; margin-top: 30px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Inscripciones</h1>

        <div class="section" id="formulario">
            <h2>Formulario de Inscripción</h2>
            
            <div id="mensajeCerrado" class="mensaje-cerrado">
                <h3>❌ No hay rodeos abiertos en este momento.</h3>
                <p>Comunícate con la administración para más información.</p>
            </div>

            <div id="contenedorFormulario" style="display: none;">
                <form id="registroForm">
                    <div class="form-group">
                        <label>Seleccione el Rodeo:</label>
                        <select id="rodeo" required>
                            <option value="">Cargando rodeos...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="nombre" placeholder="Nombre del jinete" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="rut" placeholder="RUT" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="telefono" placeholder="Teléfono" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="club" placeholder="Asociación o club" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="caballo" placeholder="Nombre del caballo" required>
                    </div>
                    <div class="form-group">
                        <label>Seleccione la Serie:</label>
                        <select id="serie" required>
                            <option value="">Cargando series...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="companero" placeholder="Compañero de collera" required>
                    </div>
                    <button type="submit" id="btnRegistrar">Registrar Inscripción</button>
                </form>
            </div>
        </div>
        
        <!-- Enlace que abre el panel de control en una pestaña nueva -->
        <a href="admin.html" target="_blank" class="admin-link">🔑 Acceso Administrador</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCqtSOu4YemJGUb9dRG_7IDZZBL4E3yNsM",
          authDomain: "inscripciones-rodeos-909bb.firebaseapp.com",
          projectId: "inscripciones-rodeos-909bb",
          storageBucket: "inscripciones-rodeos-909bb.firebasestorage.app",
          messagingSenderId: "541411909779",
          appId: "1:541411909779:web:4cae02b122a4ac8928ad66"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const selectRodeo = document.getElementById('rodeo');
        const selectSerie = document.getElementById('serie');
        const formDiv = document.getElementById('contenedorFormulario');
        const msjCerrado = document.getElementById('mensajeCerrado');

        // Escuchar Rodeos Abiertos
        const qRodeos = query(collection(db, "rodeos"), where("estado", "==", "abierto"));
        onSnapshot(qRodeos, (snapshot) => {
            selectRodeo.innerHTML = '<option value="">Seleccione el Rodeo...</option>';
            if(snapshot.empty) {
                formDiv.style.display = "none";
                msjCerrado.style.display = "block";
            } else {
                formDiv.style.display = "block";
                msjCerrado.style.display = "none";
                snapshot.forEach(doc => {
                    selectRodeo.innerHTML += `<option value="${doc.data().nombre}">${doc.data().nombre}</option>`;
                });
            }
        });

        // Escuchar Series Abiertas
        const qSeries = query(collection(db, "series"), where("estado", "==", "abierto"));
        onSnapshot(qSeries, (snapshot) => {
            selectSerie.innerHTML = '<option value="">Seleccione la Serie...</option>';
            snapshot.forEach(doc => {
                selectSerie.innerHTML += `<option value="${doc.data().nombre}">${doc.data().nombre}</option>`;
            });
        });

        // Guardar Inscripción
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegistrar');
            btn.innerText = "Guardando..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "inscripciones"), {
                    rodeo: document.getElementById('rodeo').value,
                    serie: document.getElementById('serie').value,
                    nombre: document.getElementById('nombre').value,
                    rut: document.getElementById('rut').value,
                    telefono: document.getElementById('telefono').value,
                    club: document.getElementById('club').value,
                    caballo: document.getElementById('caballo').value,
                    companero: document.getElementById('companero').value,
                    fecha: Date.now()
                });
                alert("¡Inscripción guardada exitosamente!");
                this.reset();
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
            btn.innerText = "Registrar Inscripción"; btn.disabled = false;
        });
    </script>
</body>
</html>
